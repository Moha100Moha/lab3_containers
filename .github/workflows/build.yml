name: Release

on: push

# Разрешение на создание релиза
permissions:
  contents: write

jobs:
  # Сборка и тесты на Linux (Ubuntu)
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Prepare binary
        run: cp build/ip_filter ip_filter-linux
      - uses: actions/upload-artifact@v4
        with:
          name: ip_filter-linux
          path: ip_filter-linux

  # Сборка и тесты на Windows
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Prepare binary
        shell: bash
        run: cp build/Release/ip_filter.exe ip_filter-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ip_filter-windows
          path: ip_filter-windows.exe

  # Создание релиза: запускается только после успешных сборок на обеих ОС
  create-release:
    needs: [build-ubuntu, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Release v1.0.${{ github.run_number }}" \
            --notes "Автоматическая сборка лабораторной работы №2 (Linux и Windows)"